services:
  fh-swifty-ui:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: fh-swifty-ui
    container_name: fh-swifty-ui
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

      # Neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123

      # MCP (ggf. von deiner App erwartet – Name/Port ggf. anpassen)
      - MCP_HOST=fh-swifty-mcp
      - MCP_PORT=8081
      # optional: - MCP_URL=http://fh-swifty-mcp:8080

    depends_on:
      - neo4j
      - fh-swifty-mcp
    networks:
      - fh-swifty-network
    restart: always

  # MCP Service
  fh-swifty-mcp:
    build:
      context: ./Neue_Codes KI_Intergration
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    image: fh-swifty-mcp
    container_name: fh-swifty-mcp
    ports:
      - "8081:8081"
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password123
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - neo4j
    networks:
      - fh-swifty-network
    restart: always

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.15-community
    container_name: fh-swifty-neo4j
    environment:
      - NEO4J_AUTH=neo4j/password123
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks:
      - fh-swifty-network
    restart: always

volumes:
  neo4j_data:

networks:
  fh-swifty-network:
    driver: bridge
